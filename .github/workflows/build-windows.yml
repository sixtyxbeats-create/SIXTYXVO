name: Build STEINEX TRANSIT FX (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (JUCE 8.0.4 is downloaded automatically)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 (Release)
        run: cmake --build build --config Release --target TransitFX_VST3 --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: STEINEX-TRANSIT-FX-VST3-win64
          path: build/TransitFX_artefacts/Release/VST3/STEINEX TRANSIT FX.vst3

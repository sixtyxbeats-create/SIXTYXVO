
name: Build STEINEX TRANSIT FX (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure JUCE Project
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 (Release)
        run: cmake --build build --config Release --target TransitFX_VST3 --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: STEINEX-TRANSIT-FX-VST3-win64
          path: build/TransitFX_artefacts/Release/VST3/STEINEX TRANSIT FX.vst3
          if-no-files-found: error
